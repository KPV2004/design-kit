# Runs on every PR and push to main: unit tests, example project verify, browser tests, zip build.
# Same steps as ./tools/check.sh locally.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Run checks
        run: ./tools/check.sh
