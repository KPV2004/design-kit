# Deploy the bilingual docs site to GitHub Pages → https://kpv2004.github.io/design-kit/
name: Docs
on:
  push:
    branches: [main]
    paths: ['docs-site/**', 'docs/images/**', 'CHANGELOG.md', 'examples/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs, as in GitHub's Pages starter workflow: deploy-pages lists the run's artifacts, and right after
  # an upload in the same job that list can still be empty ("No artifacts named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (page, screenshots, icon, changelog, live demo)
        run: |
          mkdir -p site
          cp -r docs-site/* site/
          cp -r docs/images site/images
          cp .claude-plugin/icon.png site/icon.png
          cp CHANGELOG.md site/CHANGELOG.md
          cp -r examples/procura-design site/demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
