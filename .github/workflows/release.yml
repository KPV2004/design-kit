# Push a tag like v1.0.0 → builds the claude.ai upload zip and attaches it to a GitHub Release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          [ "$TAG" = "$PLUGIN" ] || { echo "Tag $TAG != plugin.json version $PLUGIN"; exit 1; }
      - name: Build skill zip
        run: ./tools/build-skill.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ux-ui-designer.zip
          generate_release_notes: true
