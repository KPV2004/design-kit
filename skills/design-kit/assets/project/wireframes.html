<!--
  SCREEN FORMAT — one block per screen, in inventory order:
  <!== SCREEN: id ==> ... <template id data-title data-module data-device data-notes> ... </template> <!== /SCREEN: id ==>
    data-device: desktop | mobile | responsive
    frames: .frame-desktop (1280) · .frame-tablet (768) · .frame-mobile (390) — responsive screens put all frames
            they need in the SAME template; the toolbar filter shows All / Desktop / Tablet / Mobile
    data-notes:  one entry per .anno marker, separated by |
  Building blocks: .wf-box .wf-fill .wf-line .wf-img .wf-btn(.primary) .wf-input .wf-label .anno
  Navigation: onclick="showScreen('id')"
-->

<!-- ════════ SCREEN: login ════════ -->
<template id="login" data-title="Sign in" data-module="Auth" data-device="responsive"
          data-notes="Remember last username in the user field|Forgot password opens the reset screen">
  <div class="frame-desktop wf-box flex items-center justify-center" data-label="Desktop 1280">
    <div class="wf-box p-8 w-96 space-y-4">
      <div class="wf-img h-12 w-32 mx-auto"></div>
      <div><div class="wf-label">Username <span class="anno">1</span></div><div class="wf-input"></div></div>
      <div><div class="wf-label">Password</div><div class="wf-input"></div></div>
      <button class="wf-btn primary w-full" onclick="showScreen('list')">Sign in</button>
      <p class="text-xs text-center underline">Forgot password <span class="anno">2</span></p>
    </div>
  </div>
  <div class="frame-tablet bg-white flex items-center justify-center" data-label="Tablet 768">
    <div class="wf-box p-8 w-96 space-y-4">
      <div class="wf-img h-12 w-32 mx-auto"></div>
      <div><div class="wf-label">Username <span class="anno">1</span></div><div class="wf-input"></div></div>
      <div><div class="wf-label">Password</div><div class="wf-input"></div></div>
      <button class="wf-btn primary w-full" onclick="showScreen('list')">Sign in</button>
      <p class="text-xs text-center underline">Forgot password <span class="anno">2</span></p>
    </div>
  </div>
  <div class="frame-mobile bg-white p-5 space-y-4" data-label="Mobile 390">
    <div class="wf-img h-10 w-28"></div>
    <div><div class="wf-label">Username <span class="anno">1</span></div><div class="wf-input"></div></div>
    <div><div class="wf-label">Password</div><div class="wf-input"></div></div>
    <button class="wf-btn primary w-full" onclick="showScreen('list')">Sign in</button>
    <p class="text-xs text-center underline">Forgot password <span class="anno">2</span></p>
  </div>
</template>
<!-- ════════ /SCREEN: login ════════ -->

<!-- ════════ SCREEN: list ════════ -->
<template id="list" data-title="Document list" data-module="Documents" data-device="desktop"
          data-notes="Four primary filters; the rest live under "More filters"|Pagination is server-side">
  <div class="frame-desktop wf-box flex" data-label="Desktop 1280">
    <div class="w-56 border-r-2 border-slate-300 p-4 space-y-3">
      <div class="wf-img h-8"></div><div class="wf-line w-3/4"></div><div class="wf-line w-2/3"></div><div class="wf-line w-3/4"></div>
    </div>
    <div class="flex-1 p-6 space-y-4">
      <div class="flex justify-between"><div class="font-semibold">Document list</div><button class="wf-btn primary" onclick="showScreen('detail')">+ New document</button></div>
      <div class="flex gap-2"><div class="wf-input w-40"></div><div class="wf-input w-40"></div><div class="wf-input w-40"></div><div class="wf-input w-40"></div><span class="anno">1</span></div>
      <div class="wf-box"><div class="wf-fill h-8 rounded-none"></div>
        <div class="p-3 space-y-3"><div class="wf-line"></div><div class="wf-line"></div><div class="wf-line"></div><div class="wf-line w-5/6"></div></div></div>
      <div class="flex justify-end gap-1 text-xs">1–50 of 12,431 <span class="anno">2</span></div>
    </div>
  </div>
</template>
<!-- ════════ /SCREEN: list ════════ -->

<!-- ════════ SCREEN: detail ════════ -->
<template id="detail" data-title="Detail / form" data-module="Documents" data-device="desktop" data-notes="">
  <div class="frame-desktop wf-box p-6 space-y-4" data-label="Desktop 1280">
    <div class="font-semibold">New document</div>
    <div class="grid grid-cols-3 gap-4">
      <div><div class="wf-label">Field 1</div><div class="wf-input"></div></div>
      <div><div class="wf-label">Field 2</div><div class="wf-input"></div></div>
      <div><div class="wf-label">Field 3</div><div class="wf-input"></div></div>
    </div>
    <div class="flex justify-end gap-2"><button class="wf-btn" onclick="showScreen('list')">Cancel</button><button class="wf-btn primary" onclick="showScreen('list')">Save</button></div>
  </div>
</template>
<!-- ════════ /SCREEN: detail ════════ -->
